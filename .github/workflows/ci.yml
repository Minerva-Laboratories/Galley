# The checks that must pass before a change is done, run on every push.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The web app is embedded into the binary, so the Rust build needs npm.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # latexdiff powers the camera-ready comparison; bubblewrap is the compile sandbox.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap latexdiff
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  engines:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Install real compile tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap latexdiff latexmk biber ghostscript poppler-utils \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-xetex \
            texlive-luatex texlive-fonts-recommended texlive-pstricks texlive-bibtex-extra fonts-dejavu-core
          # Ubuntu's AppArmor namespace restriction otherwise prevents the real compile sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compile the strict five-engine integration matrix
        env:
          GALLEY_ENGINE_TEST_ROOT: ${{ runner.temp }}/galley-engines
        run: bash scripts/test-engines.sh
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Verify browser selection and temporary builds
        env:
          GALLEY_TEST_ENGINE_MATRIX: "1"
          GALLEY_TEST_TECTONIC: ${{ runner.temp }}/galley-engines/tectonic/tectonic
          GALLEY_TEST_TECTONIC_CACHE: ${{ runner.temp }}/galley-engines/cache
        run: bash scripts/e2e.sh engines.spec.ts
