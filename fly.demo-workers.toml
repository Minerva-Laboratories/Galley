# Build workers for galley-demo. Reached only over the private network (Flycast). The proxy
# sends one compile to each machine at a time, starts a stopped machine when all are busy, and
# stops machines that sit idle.
app = 'galley-demo-workers'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'
  [build.args]
    TEXLIVE = '1'
    WARM_TECTONIC = '1'

[env]
  GALLEY_ROLE = 'worker'
  GALLEY_SANDBOX = 'auto'
  GALLEY_MEMORY_MB = '1600'
  GALLEY_MAX_BUILDS = '1'

[http_service]
  internal_port = 7100
  force_https = false
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 1
    hard_limit = 1

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
