[package]
name = "galley-build"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sandboxed compiles: engines, log parser, hints, SyncTeX, build queue"

[dependencies]
chrono.workspace = true
flate2.workspace = true
futures-util.workspace = true
galley-index.workspace = true
# Only for the `O_NOFOLLOW` and `O_NONBLOCK` flags used when opening files a compile wrote.
libc = "0.2"
svg2pdf = "0.13"
regex.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
# Checks the Tectonic binary and package bundle against deploy/tectonic.pins.
sha2 = "0.11"
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

